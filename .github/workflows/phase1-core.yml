name: Phase 1 Core Invariants

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase1-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Phase 1 architectural gate
        run: node scripts/check-phase1-core.mjs
      - name: Typecheck
        run: bunx tsgo --noEmit
