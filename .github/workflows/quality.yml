name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and Phase 0 security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and generate typed routes
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Verify dependency lock
        run: git diff --exit-code bun.lock

      - name: Validate migrations
        run: |
          test -f supabase/manual/20260814020000_supplies_module.sql
          test -f supabase/manual/20260815000000_product_code_normalization.sql
          test -f supabase/manual/20260815010000_product_code_audit_compatibility.sql
          test -f supabase/manual/20260817000000_intelligent_replenishment.sql
          test -f supabase/manual/20260818000000_purchasing_commercial_intelligence.sql
          test -f supabase/migrations/20260825090000_fiscal_foundation.sql
          test -f supabase/migrations/20260825091000_fiscal_management_policies.sql
          test -f supabase/migrations/20260825140000_fiscal_homologation_gateway.sql
          test -f supabase/migrations/20260829143000_phase0_security_containment.sql
          test -f supabase/tests/phase0_tenant_isolation.sql
          ! rg '^(<<<<<<<|=======|>>>>>>>)' supabase

      - name: Phase 0 source invariants
        run: |
          ! test -f .env
          ! git ls-files --error-unmatch .env >/dev/null 2>&1
          ! rg 'inviteUserByEmail' src
          rg 'has_any_active_tenant_membership' supabase/migrations/20260829143000_phase0_security_containment.sql
          rg 'changed_count <> 80' supabase/migrations/20260829143000_phase0_security_containment.sql
          rg 'commission_pct' supabase/migrations/20260829143000_phase0_security_containment.sql
          rg 'PHASE0 FAIL: vendedor leu dados do tenant demo' supabase/tests/phase0_tenant_isolation.sql
          rg 'PHASE0 FAIL: consulta leu dados do tenant demo' supabase/tests/phase0_tenant_isolation.sql
          rg 'PHASE0 FAIL: gerente demo leu o tenant real' supabase/tests/phase0_tenant_isolation.sql
          rg 'PHASE0 FAIL: externo leu outro tenant' supabase/tests/phase0_tenant_isolation.sql

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Run mandatory Phase 0 database tests
        run: supabase test db supabase/tests/phase0_tenant_isolation.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
