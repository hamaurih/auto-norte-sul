name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and generate typed routes
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Validate migrations
        run: |
          test -f supabase/manual/20260814020000_supplies_module.sql
          test -f supabase/manual/20260815000000_product_code_normalization.sql
          test -f supabase/manual/20260815010000_product_code_audit_compatibility.sql
          test -f supabase/manual/20260817000000_intelligent_replenishment.sql
          test -f supabase/manual/20260818000000_purchasing_commercial_intelligence.sql
          ! rg '^(<<<<<<<|=======|>>>>>>>)' supabase
