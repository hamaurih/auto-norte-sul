name: Synchronize Bun Lockfile
on:
  push:
    branches:
      - feat/sentry-monitoring-20261022
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Resolve dependencies and regenerate bun.lock
        run: bun install --lockfile-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: synchronize bun.lock for Sentry'
          git push origin HEAD:feat/sentry-monitoring-20261022
