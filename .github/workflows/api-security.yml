name: API Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-security:
    name: Auth, rate-limit and route invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify API security invariants
        run: node scripts/check-api-security.mjs
      - name: Verify RLS/PII migration is versioned
        run: |
          test -f supabase/migrations/20260829160000_auth_api_pii_hardening.sql
          grep -F 'auth_login_attempts_deny_clients' supabase/migrations/20260829160000_auth_api_pii_hardening.sql
          grep -F 'norte_sul_user_pii_master_key_v1' supabase/migrations/20260829160000_auth_api_pii_hardening.sql
          grep -F 'get_my_private_profile' supabase/migrations/20260829160000_auth_api_pii_hardening.sql
