name: Phase 1 One-Time Remediation

on:
  push:
    branches: [main]
    paths:
      - "scripts/phase1-remediate-once.mjs"
      - ".github/workflows/phase1-remediation-once.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic patches
        id: patch
        continue-on-error: true
        run: node scripts/phase1-remediate-once.mjs
      - name: Diagnose a rejected patch
        if: steps.patch.outcome == 'failure'
        run: |
          echo "Remaining Bling source flag references after attempted patch:"
          grep -nE "source_products|source_stock|source_price_b2c" src/routes/_authenticated/admin.ecossistema.bling.tsx || true
          echo "Remaining runtime user_roles references after attempted patch:"
          grep -RInE '\.from\(["'"']user_roles["'"']\)' src --include='*.ts' --include='*.tsx' || true
      - name: Stop on rejected patch
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - name: Verify Phase 1 gate before commit
        run: node scripts/check-phase1-core.mjs
      - name: Commit verified remediation and remove runner
        run: |
          rm scripts/phase1-remediate-once.mjs .github/workflows/phase1-remediation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: remove legacy auth and Bling source controls"
          git push origin HEAD:main
