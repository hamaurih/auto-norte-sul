name: PDV Android CI

on:
  push:
    branches:
      - main
      - "feat/pdv-stone-android-p0-5"
    paths:
      - "apps/pdv-android/**"
      - ".github/workflows/pdv-android.yml"
  pull_request:
    paths:
      - "apps/pdv-android/**"
      - ".github/workflows/pdv-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pdv-android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          LIMIT=$((70 * 1024 * 1024))
          echo "APK bytes: $BYTES"
          if [ "$BYTES" -ge "$LIMIT" ]; then
            echo "APK ultrapassou o limite operacional de 70 MB."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: norte-sul-pdv-debug
          path: apps/pdv-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
